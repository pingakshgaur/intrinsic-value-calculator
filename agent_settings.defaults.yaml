# Factory copy of agent_settings.yaml. The HYBRID MODEL Studio restores its
# constants from here ("Defaults"). Do not edit - change agent_settings.yaml.

# =============================================================================
# Market Intelligence Agents - every editable constant in one place
# =============================================================================
#
# Run:   python run.py --agents                 (full research + valuation)
#        python run.py --agents --quick         (news / market sweep only)
#        python run.py --agents --llm-check     (test your API keys)
#
# Anything removed from this file falls back to the default built into
# src/agents/settings.py, so a broken edit cannot crash a scheduled run - it
# is reported in the log and the default is used instead.
#
# Units: rates are decimals (0.015 = 1.5%). Scores run -1 (bad) .. +1 (good).
# =============================================================================

# ---------------------------------------------------------------- the run ---
run:
  # Companies to research. Same CSV format as the main calculator.
  companies_csv: data/companies.csv
  # Optional: only research these tickers from the CSV (empty = all of them).
  only_tickers: []
  # Years of history the base valuation reads (ending at the latest complete FY).
  history_years: 5
  # Companies researched in parallel. Keep low on free LLM tiers.
  parallel_companies: 3
  # Train the four ML learners for the base valuation, on the whole learning
  # pool. A training is reused until the pool changes. The cloud workflow
  # passes --no-ml.
  base_valuation_ml: true
  # Value the companies being researched against every company the app knows
  # (watchlists, training lists, the valuation report's companies and every
  # company researched before), from cached accounts - no extra downloads.
  learn_from_pool: true
  # Where the blackboard database and reports go. The cloud workflow points
  # this at a checkout of the 'intel-reports' branch so history survives.
  state_dir: output/intel
  # Dated report folders kept under <state_dir>/reports (oldest deleted).
  keep_reports: 60
  # How long fetched feeds are reused before downloading again (hours).
  feed_cache_hours: 6
  # Ignore news older than this.
  news_lookback_days: 30
  # Insider / shareholding look-back.
  ownership_lookback_days: 180

# ---------------------------------------------------------- LLM providers ---
# Hybrid mode: numbers are always computed in Python. The LLM is only used
# where text must be read (news, announcements) or written (bull/bear cases,
# the chief's summary). With no API keys at all, every agent falls back to its
# rule-based path and the run still completes.
#
# Keys are read from environment variables (or a local .env file), NEVER from
# this file. In GitHub Actions they come from repository secrets.
llm:
  enabled: true
  # Hard ceiling on LLM calls in one run, across all providers.
  max_calls_per_run: 400
  # Identical prompts are answered from the cache for this long (hours).
  cache_hours: 20
  # Tries per call before falling through to the next provider.
  retries: 2
  timeout_seconds: 75
  temperature: 0.2

  # Which provider/model handles each kind of task, tried in order. "fast" is
  # bulk classification (headline sentiment, materiality); "smart" is
  # reasoning and writing (bull/bear cases, chief summary).
  routes:
    # Pick models in the web app (Settings -> AI providers) from each
    # provider's live list; model names change as providers retire them.
    fast:  [groq:fast, gemini:fast, nvidia:fast]
    smart: [groq:smart, gemini:smart, nvidia:smart]

  providers:
    groq:
      base_url: https://api.groq.com/openai/v1
      key_env: GROQ_API_KEY
      models:
        fast: openai/gpt-oss-20b
        smart: openai/gpt-oss-120b
      # Free-tier limits. The router paces itself to stay under them.
      requests_per_minute: 28
      requests_per_day: 14000
      tokens_per_minute: 6000
    gemini:
      # Google's OpenAI-compatible endpoint.
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      key_env: GEMINI_API_KEY
      models:
        fast: gemini-3.5-flash-lite
        smart: gemini-3.8-flash
      requests_per_minute: 9
      requests_per_day: 240
      tokens_per_minute: 200000
    nvidia:
      base_url: https://integrate.api.nvidia.com/v1
      key_env: NVIDIA_API_KEY
      models:
        fast: nvidia/nemotron-3-ultra-550b-a55b
        smart: nvidia/nemotron-3-ultra-550b-a55b
      requests_per_minute: 35
      requests_per_day: 5000
      tokens_per_minute: 100000
    # Any other OpenAI-compatible service can be added the same way, e.g.
    # openrouter:
    #   base_url: https://openrouter.ai/api/v1
    #   key_env: OPENROUTER_API_KEY
    #   models: {fast: "...", smart: "..."}
    #   requests_per_minute: 15
    #   requests_per_day: 50

# --------------------------------------------------------- data sources -----
sources:
  # NSE portal APIs (announcements, insider trades, shareholding, pledges,
  # delivery %). NSE often blocks datacentre IPs, including GitHub's runners;
  # every agent degrades to yfinance / news when NSE refuses.
  use_nse: true
  use_google_news_rss: true
  news_max_items: 25
  # Credibility tiers for news domains. Unlisted domains get 'unknown'.
  credibility:
    tier_weights: {primary: 1.0, tier1: 0.85, tier2: 0.6, unknown: 0.35, low: 0.1}
    primary: [nseindia.com, bseindia.com, sebi.gov.in, rbi.org.in, mca.gov.in, pib.gov.in]
    tier1: [reuters.com, bloomberg.com, economictimes.indiatimes.com, livemint.com,
            business-standard.com, thehindubusinessline.com, financialexpress.com,
            moneycontrol.com, cnbctv18.com, ft.com, wsj.com, ndtvprofit.com]
    tier2: [zeebiz.com, businesstoday.in, thehindu.com, indianexpress.com,
            hindustantimes.com, timesofindia.indiatimes.com, outlookbusiness.com,
            investing.com, marketscreener.com, tradingview.com]
    low: [blogspot.com, medium.com, wordpress.com, youtube.com, telegram.me]

# ------------------------------------------------------------ macro ---------
# Values you update by hand when they change (RBI policy, CPI print, GDP).
# The rest is fetched live from Yahoo Finance each run.
macro:
  repo_rate: 0.0550
  cpi_inflation: 0.0300
  rbi_inflation_target: 0.0400
  real_gdp_growth: 0.0650
  india_10y_yield: 0.0640
  # "Normal" levels the live readings are compared against.
  normal_india_vix: 15.0
  normal_brent_usd: 75.0
  inr_depreciation_tolerance_1y: 0.04
  live_tickers:
    nifty: ^NSEI
    india_vix: ^INDIAVIX
    usd_inr: INR=X
    brent: BZ=F
    us_10y: ^TNX
    gold: GC=F

