# ====================================================== HYBRID MODEL ========
# The project's headline intrinsic value. The full method is written out at
# the top of src/hybrid_formula.py; every number below can also be changed live
# in the web app's Hybrid Model Lab (and saved back here from there).
#
#   k  = max(Rf + beta x ERP, floor) + SUM premia            cost of equity
#   g  = g_base + SUM tilts                                   growth
#   six lenses: cash flow, earnings power, asset, market, conservative, learning
#   growth-credibility gate on the cash-flow lens
#   V  = geometric blend of lenses x Q x (1 - H), then bull / base / bear
hybrid_model:
  # ---- cost of equity ------------------------------------------------------
  risk_free_rate: 0.0640          # usually = macro.india_10y_yield
  equity_risk_premium: 0.0550
  min_cost_of_equity: 0.10        # floor on the CAPM figure, before premia
  cost_of_debt_pre_tax: 0.0850
  premia_caps:                    # each premium = cap x risk(0..1)
    size: 0.030                   # actual size premium comes from size_bands
    liquidity: 0.020
    governance: 0.030
    forensic: 0.030
    leverage: 0.020
    macro: 0.015
    geopolitical: 0.020
    earnings_volatility: 0.015
  max_total_premium: 0.080
  size_bands:                     # market cap in rupee crore -> premium
    - {min_cr: 100000, premium: 0.000}
    - {min_cr: 20000,  premium: 0.005}
    - {min_cr: 5000,   premium: 0.015}
    - {min_cr: 1000,   premium: 0.025}
    - {min_cr: 0,      premium: 0.030}
  leverage_free_de: 0.5           # no leverage premium below this debt/equity
  leverage_full_de: 2.5           # full premium at this debt/equity

  # ---- growth --------------------------------------------------------------
  growth:
    min: 0.02
    max: 0.20
    terminal: 0.050
    terminal_cap_over_gdp: 0.0    # terminal <= real GDP + inflation + this
    high_growth_years: 5
    fade_years: 5
    min_spread_k_minus_g: 0.020
    tilts_caps:                   # each tilt = cap x score(-1..+1)
      industry_tailwind: 0.020
      earnings_momentum: 0.015
      news_impact: 0.010
      macro_growth: 0.005

  # ---- the six lenses --------------------------------------------------------
  # Weight of each lens by company type. 0 switches a lens off for that type.
  lens_weights:
    mature:     {cash_flow: 1.0, earnings_power: 0.8, asset: 0.6, market: 1.0, conservative: 0.3, learning: 0.6}
    lender:     {cash_flow: 1.0, earnings_power: 0.8, asset: 1.0, market: 0.8, conservative: 0.4, learning: 0.5}
    loss_maker: {cash_flow: 0.6, earnings_power: 0.2, asset: 1.0, market: 0.4, conservative: 0.0, learning: 0.6}
    young:      {cash_flow: 0.8, earnings_power: 0.5, asset: 0.5, market: 1.2, conservative: 0.2, learning: 0.3}
  use_learning_lens: true
  # Calibration: remove each lens's median miss against the 1-May price in
  # EARLIER years (point-in-time), and weight lenses by their past accuracy.
  calibration:
    enabled: true
    skill_weighting: true
    shrink_k: 10                  # evidence needed to move halfway off neutral
    min_obs: 4                    # history needed before a lens is calibrated
  # Growth-credibility gate: the share of the cash-flow value that may come
  # from growth (PVGO) is capped at base + moat_bonus x moat.
  gate:
    base_pvgo_share: 0.45
    moat_bonus: 0.30
  fcff_value_driver_weight: 0.5   # 0 = observed FCFF, 1 = NOPAT x (1 - g/RONIC)
  ri_persistence: 0.62            # lenders' residual-income fade
  asset_pb_bounds: [0.5, 6.0]     # justified P/B is kept inside these
  outlier_ratio: 3.0              # drop lenses this many times off the centre
  estimate_penalty: 0.75          # weight multiplier for estimated inputs

  # ---- quality and governance ----------------------------------------------
  quality_caps:                   # Q = 1 + SUM cap x score
    moat: 0.10
    earnings_quality: 0.07
    financial_strength: 0.05
    capital_allocation: 0.03
  quality_bounds: [0.75, 1.25]
  governance:
    haircut_per_red_flag: 0.05
    max_haircut: 0.30
    pledge_flag_above: 0.25
    promoter_selling_flag_above: 0.02

  # ---- scenarios -------------------------------------------------------------
  scenarios:
    probabilities: {bull: 0.25, base: 0.50, bear: 0.25}
    max_probability_tilt: 0.10
    bull: {growth_shift: 0.020, rate_shift: -0.010, quality_shift: 0.05}
    bear: {growth_shift: -0.030, rate_shift: 0.015, quality_shift: -0.08}

  # ---- uncertainty, confidence, safety, labels -----------------------------
  base_sigma: 0.20                # added to the lenses' disagreement
  confidence_tolerance: 0.20      # confidence = P(price within this of value)
  confidence_weights:             # used when the research agents ran
    model: 0.40
    evidence_coverage: 0.20
    validation: 0.25
    agreement: 0.15
  margin_of_safety:
    base: 0.15
    per_low_confidence: 0.15
    per_red_flag: 0.03
    max: 0.45
  labels:                         # research labels from price / value
    deep_value_below: 0.65
    undervalued_below: 0.90
    overvalued_above: 1.15
    min_confidence_for_label: 25
    red_flags_for_avoid: 3
  overlay_weight: 0.0             # sentiment/flows tilt; 0 keeps them out

forensics:
  # Beneish (1999) 8-variable cut-off. Above it = manipulator profile.
  beneish_threshold: -1.78
  # A red flag (and governance haircut) is raised only this far above the
  # cut-off; scores between the two still add graded forensic risk.
  beneish_flag_margin: 0.25

# =================================================== the agent hierarchy =====
# Weight of each analyst inside its lead's section score. Set an analyst's
# weight to 0 to switch it off entirely.
agents:
  market_news_lead:
    research_analyst: 0.20
    sentiment_analyst: 0.25
    stock_movement_analyst: 0.15
    news_credibility_analyst: 0.10
    market_impact_analyst: 0.30
  equity_research_lead:
    fundamental_research_analyst: 0.45
    financial_forensics_analyst: 0.40
    pre_earnings_analyst: 0.15
  industry_geo_lead:
    industry_research_analyst: 0.55
    geopolitical_risk_analyst: 0.45
  market_activity_lead:
    market_volume_analyst: 0.20
    insider_activity_analyst: 0.30
    fund_holdings_analyst: 0.30
    short_seller_analyst: 0.20
  review_lead:
    bull_case_analyst: 0.35
    bear_case_analyst: 0.35
    research_validation_analyst: 0.30

  # Weight of each lead in the chief's overall research score.
  chief:
    market_news_lead: 0.15
    equity_research_lead: 0.35
    industry_geo_lead: 0.15
    market_activity_lead: 0.20
    review_lead: 0.15

  # Evidence rules enforced by the Research Validation analyst.
  validation:
    max_evidence_age_days: 400    # financial statements are annual
    max_news_age_days: 30
    min_sources_for_claim: 1
    require_source_url: true

# ------------------------------------------------------------ alerts --------
# Optional Telegram message after each run (needs TELEGRAM_BOT_TOKEN and
# TELEGRAM_CHAT_ID). Off by default.
alerts:
  telegram: false
  # Only alert on these changes since the previous run.
  on_label_change: true
  on_new_red_flag: true
  on_price_crossing_buy_below: true
